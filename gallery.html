  <style>
    @font-face {
      font-family: 'Mono';
      src: url('fonts/jetbrains-mono-400.woff2') format('woff2');
      font-display: swap;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0b0c10;
      color: #e2e4ea;
      font-family: 'Mono', monospace, ui-monospace;
      font-size: 13px;
      line-height: 1.5;
      padding-bottom: 60px;
    }
    header {
      position: sticky;
      top: 0;
      z-index: 50;
      padding: 16px 24px;
      background: rgba(11, 12, 16, 0.94);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-bottom: 1px solid #282c37;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }
    .brand {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .brand h1 {
      font-size: 14px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #eceff4;
      font-weight: 700;
    }
    .brand p {
      color: #9aa0b2;
      font-size: 11px;
    }
    .back-btn {
      color: #88c0d0;
      text-decoration: none;
      font-size: 12px;
      padding: 5px 12px;
      border: 1px solid #282c37;
      background: #151821;
      border-radius: 2px;
      transition: all 0.15s ease;
    }
    .back-btn:hover {
      color: #fff;
      border-color: #88c0d0;
      background: #1e2330;
      text-decoration: none;
    }
    main {
      columns: 2 180px;
      column-gap: 12px;
      padding: 16px 20px;
      max-width: 1400px;
      margin: 0 auto;
    }
    .pin {
      break-inside: avoid;
      margin: 0 0 12px;
      position: relative;
      background: #151821;
      border: 1px solid #282c37;
      overflow: hidden;
      transition: transform 0.2s ease, border-color 0.2s ease;
    }
    .pin:hover {
      transform: translateY(-2px);
      border-color: #3d4455;
    }
    .pin img {
      display: block;
      width: 100%;
      height: auto;
      filter: contrast(1.02);
    }
    figcaption {
      position: absolute;
      right: 6px;
      bottom: 6px;
      background: rgba(0, 0, 0, 0.75);
      color: #eceff4;
      padding: 2px 6px;
      font-size: 9.5px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      letter-spacing: 0.5px;
      pointer-events: none;
    }
    @media (min-width: 700px) {
      main { columns: 3 220px; }
    }
    @media (min-width: 1000px) {
      main { columns: 4 230px; }
    }
